<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Space Explorer — MVP1</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #05070d; }
  canvas {
    display: block; touch-action: none;
    /* Long-press opens the tile report, not Safari's callout/selection. */
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; font: 12px/1.4 system-ui, sans-serif; color: #cfe0ff;
    background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0));
    pointer-events: none;
  }
  #hud > * { pointer-events: auto; }
  #seed-label { opacity: 0.85; }
  button {
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
    color: #fff; border-radius: 4px; padding: 3px 8px; font: inherit; cursor: pointer;
  }
  button:hover { background: rgba(255,255,255,0.2); }

  #player-hud {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 16px;
    padding: 10px 12px; font: 13px/1.4 system-ui, sans-serif; color: #cfe0ff;
    background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.6));
    pointer-events: none;
  }
  #player-hud > * { pointer-events: auto; }
  #turn-label { font-weight: 600; }
  #end-turn { margin-left: auto; }

  /* Larger touch targets for iPad — the default `button` padding/font-size
     (meant for the compact seed-bar "New Game" button) was too small to
     comfortably tap for these two, which carry real gameplay consequences
     (ending a turn, dismissing a result overlay) and get tapped every turn. */
  #end-turn, #interstitial-continue, #anomaly-continue, #combat-continue {
    padding: 16px 32px;
    font-size: 18px;
    min-height: 48px;
    border-radius: 8px;
  }

  #player-badge {
    position: fixed; top: 10px; right: 10px;
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font: 600 11px/1 system-ui, sans-serif; color: #05070d;
    border: 2px solid rgba(255,255,255,0.85);
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }

  #win-banner {
    position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
    padding: 8px 16px; font: 14px/1.4 system-ui, sans-serif; color: #05070d;
    background: #8fe3a0; border-radius: 6px; display: none;
  }
  #win-banner.visible { display: block; }

  #interstitial {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    background: #05070d; color: #cfe0ff; font: 16px/1.4 system-ui, sans-serif;
    z-index: 10; cursor: pointer;
  }
  #interstitial.visible { display: flex; }
  #interstitial-message { font-size: 1.3em; font-weight: 600; }

  #upgrade-picker {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    background: #05070d; color: #cfe0ff; font: 16px/1.4 system-ui, sans-serif;
    z-index: 10;
  }
  #upgrade-picker.visible { display: flex; }
  #upgrade-picker-title { font-size: 1.2em; font-weight: 600; }
  #upgrade-picker-options { display: flex; flex-direction: column; gap: 8px; }

  #anomaly-overlay {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    background: #05070d; color: #cfe0ff; font: 16px/1.4 system-ui, sans-serif;
    z-index: 10; cursor: pointer;
  }
  #anomaly-overlay.visible { display: flex; }
  #anomaly-message { font-size: 1.3em; font-weight: 600; text-align: center; max-width: 80%; }

  #combat-overlay {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    background: #05070d; color: #cfe0ff; font: 16px/1.4 system-ui, sans-serif;
    z-index: 10; cursor: pointer;
  }
  #combat-overlay.visible { display: flex; }
  #combat-message { font-size: 1.3em; font-weight: 600; text-align: center; max-width: 80%; }

  /* Inhabited world info card: the map stays visible, dimmed, behind it. */
  #world-card {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; padding: 16px;
    background: rgba(5,7,13,0.6); color: #cfe0ff; font: 15px/1.4 system-ui, sans-serif;
    z-index: 10; cursor: pointer;
  }
  #world-card.visible { display: flex; }
  #world-card-panel {
    position: relative; width: 320px; max-width: 100%; box-sizing: border-box;
    padding: 18px; border-radius: 12px; text-align: center;
    background: #0d1426; border: 1px solid #1b2f6b; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  #world-card-close {
    position: absolute; top: 6px; right: 8px; background: none; border: none;
    color: #cfe0ff; font-size: 22px; line-height: 1; cursor: pointer;
  }
  #world-card-name { font-size: 1.4em; font-weight: 700; color: #fff; }
  #world-card-type { opacity: 0.75; margin-bottom: 10px; }
  #world-card-image {
    display: block; width: 200px; max-width: 100%; aspect-ratio: 1;
    margin: 0 auto 10px; border-radius: 8px; background: #05070d;
  }
  #world-card-image[hidden] { display: none; }
  #world-card-species { font-size: 1.15em; font-weight: 600; color: #fff; }
  #world-card-description { margin-top: 6px; font-size: 0.9em; opacity: 0.85; text-align: left; }
  /* Tile report (long-press a hex): same card family as #world-card. */
  #tile-report {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; padding: 16px;
    background: rgba(5,7,13,0.6); color: #cfe0ff; font: 15px/1.4 system-ui, sans-serif;
    z-index: 10;
  }
  #tile-report.visible { display: flex; }
  #tile-report-panel {
    position: relative; width: 320px; max-width: 100%; max-height: 100%; overflow-y: auto;
    box-sizing: border-box; padding: 18px; border-radius: 12px;
    background: #0d1426; border: 1px solid #1b2f6b; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  #tile-report-close {
    position: absolute; top: 6px; right: 8px; background: none; border: none;
    color: #cfe0ff; font-size: 22px; line-height: 1; cursor: pointer;
  }
  #tile-report-title { font-size: 1.3em; font-weight: 700; color: #fff; padding-right: 24px; }
  #tile-report-coords { opacity: 0.75; margin-bottom: 8px; }
  #tile-report dl {
    display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0;
  }
  #tile-report dt { opacity: 0.7; }
  #tile-report dd { margin: 0; color: #fff; }
  .tile-report-entity { margin-top: 12px; padding-top: 10px; border-top: 1px solid #1b2f6b; }
  .tile-report-entity h3 { margin: 0 0 4px; font-size: 1em; color: #fff; }
  #tile-report-world {
    display: block; width: 100%; margin-top: 14px; padding: 8px; border-radius: 8px;
    background: #1b2f6b; border: 1px solid #2c4aa0; color: #fff; font: inherit; cursor: pointer;
  }
  #tile-report-world[hidden] { display: none; }
  /* Per-player notification area on the right edge. Below the full-screen
     overlays (z-index 10), so the pass-and-play interstitial hides it. */
  #notifications {
    position: fixed; top: 56px; right: 10px; bottom: 90px;
    display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
    overflow-y: auto; overflow-x: hidden; padding: 2px 2px 2px 40px;
    z-index: 5; pointer-events: none;
  }
  .notice {
    flex: none; width: 48px; height: 48px; border-radius: 50%; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid rgba(255,255,255,0.85); box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    background: #0d1426; color: #fff; font: 700 24px/1 system-ui, sans-serif;
    cursor: pointer; pointer-events: auto; touch-action: pan-y; user-select: none;
  }
  .notice img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .notice-pirate { background: #5a1414; }
  .notice-pirate img { width: 80%; height: 80%; object-fit: contain; }
  .notice-anomaly { background: #4b2a7a; }
  .notice.snap { transition: transform 0.15s, opacity 0.15s; }

  /* Start screen: opens from New Game, and on a launch with no save. Above
     every other overlay, so nothing can sit on top of it. */
  #setup {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; padding: 16px;
    background: rgba(5,7,13,0.85); color: #cfe0ff; font: 15px/1.4 system-ui, sans-serif;
    z-index: 20;
  }
  #setup.visible { display: flex; }
  #setup-panel {
    width: 620px; max-width: 100%; max-height: 100%; overflow-y: auto; box-sizing: border-box;
    padding: 20px; border-radius: 12px;
    background: #0d1426; border: 1px solid #1b2f6b; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  #setup-title { font-size: 1.5em; font-weight: 700; color: #fff; margin-bottom: 12px; }
  #setup input, #setup select {
    min-width: 0; box-sizing: border-box; min-height: 40px; padding: 6px 8px; border-radius: 6px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; font: inherit;
  }
  #setup button { min-height: 40px; min-width: 40px; padding: 6px 12px; border-radius: 6px; font-size: 15px; }
  #setup button:disabled { opacity: 0.35; cursor: default; }
  #setup-seed-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  #setup-seed { flex: 1; }
  #setup-players { display: flex; flex-direction: column; gap: 8px; }
  .setup-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  #setup select.setup-team { width: 104px; color: #05070d; font-weight: 600; border-color: rgba(255,255,255,0.85); }
  #setup select.setup-team option { background: #0d1426; color: #fff; }
  .setup-name { flex: 1 1 140px; }
  .setup-ship { flex: 1 1 220px; display: flex; align-items: center; gap: 6px; }
  .setup-ship > span { font-weight: 700; opacity: 0.8; }
  .setup-ship input { flex: 1; }
  #setup-add { margin-top: 10px; }
  #setup-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  #setup-start { background: #1b2f6b; border-color: #2c4aa0; font-weight: 600; }
  #setup-cancel[hidden] { display: none; }

  #notice-caption {
    position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
    max-width: min(420px, calc(100% - 140px)); padding: 10px 14px; border-radius: 8px;
    background: rgba(13,20,38,0.88); border: 1px solid #1b2f6b; color: #cfe0ff;
    font: 14px/1.4 system-ui, sans-serif; text-align: center;
    z-index: 5; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <span id="seed-label">seed: —</span>
  <span id="turn-count-label"></span>
  <button id="new-map">New Game</button>
</div>
<div id="player-hud">
  <span id="turn-label"></span>
  <span id="level-label"></span>
  <span id="xp-label"></span>
  <span id="moves-label"></span>
  <span id="health-label"></span>
  <button id="end-turn">End Turn</button>
</div>
<div id="player-badge"></div>
<div id="notifications"></div>
<div id="notice-caption" hidden></div>
<div id="win-banner">All star systems discovered!</div>
<div id="interstitial">
  <div id="interstitial-message"></div>
  <button id="interstitial-continue">Tap to continue</button>
</div>
<div id="upgrade-picker">
  <div id="upgrade-picker-title">Level up! Choose an upgrade:</div>
  <div id="upgrade-picker-options"></div>
</div>
<div id="anomaly-overlay">
  <div id="anomaly-message"></div>
  <button id="anomaly-continue">Tap to continue</button>
</div>
<div id="world-card">
  <div id="world-card-panel">
    <button id="world-card-close" aria-label="Close">&times;</button>
    <div id="world-card-name"></div>
    <div id="world-card-type"></div>
    <img id="world-card-image" alt="" />
    <div id="world-card-species"></div>
    <div id="world-card-description"></div>
  </div>
</div>
<div id="tile-report">
  <div id="tile-report-panel">
    <button id="tile-report-close" aria-label="Close">&times;</button>
    <div id="tile-report-title"></div>
    <div id="tile-report-coords"></div>
    <dl id="tile-report-rows"></dl>
    <div id="tile-report-entities"></div>
    <button id="tile-report-world" hidden>View world</button>
  </div>
</div>
<div id="setup">
  <div id="setup-panel">
    <div id="setup-title">New Game</div>
    <div id="setup-seed-row">
      <span>Seed</span>
      <input id="setup-seed" aria-label="Map seed" autocomplete="off" />
      <button id="setup-seed-reroll" type="button" aria-label="Random seed">🎲</button>
    </div>
    <div id="setup-players"></div>
    <button id="setup-add" type="button">+ Add player</button>
    <div id="setup-actions">
      <button id="setup-cancel" type="button">Cancel</button>
      <button id="setup-start" type="button">Start game</button>
    </div>
  </div>
</div>
<div id="combat-overlay">
  <div id="combat-message"></div>
  <button id="combat-continue">Tap to continue</button>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
